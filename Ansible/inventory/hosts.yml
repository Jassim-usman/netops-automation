---
# hosts.yml — AWX Static Inventory
#
# Format: YAML static inventory for Ansible / AWX
# Import this file into AWX under: Inventories → Sources → Sourced from a Project
#
# Replace placeholder values with real hostnames/IPs and connection details.
# Credentials (SSH keys, passwords) are managed in AWX — do not store them here.

all:
  children:

    switches:
      # All managed network switches
      hosts:

        switch-core-01:
          ansible_host: 10.0.1.1
          ansible_network_os: cisco.ios.ios
          ansible_connection: ansible.netcommon.network_cli
          site: datacenter-a
          role: core

        switch-core-02:
          ansible_host: 10.0.1.2
          ansible_network_os: cisco.ios.ios
          ansible_connection: ansible.netcommon.network_cli
          site: datacenter-a
          role: core

        switch-dist-01:
          ansible_host: 10.0.2.1
          ansible_network_os: cisco.ios.ios
          ansible_connection: ansible.netcommon.network_cli
          site: datacenter-a
          role: distribution

        switch-access-01:
          ansible_host: 10.0.3.1
          ansible_network_os: cisco.nxos.nxos
          ansible_connection: ansible.netcommon.network_cli
          site: datacenter-b
          role: access

        switch-access-02:
          ansible_host: 10.0.3.2
          ansible_network_os: cisco.nxos.nxos
          ansible_connection: ansible.netcommon.network_cli
          site: datacenter-b
          role: access

    # Subgroup: core switches only (for targeted jobs)
    core_switches:
      hosts:
        switch-core-01:
        switch-core-02:

    # Subgroup: NX-OS devices (may require different commands)
    nxos_switches:
      hosts:
        switch-access-01:
        switch-access-02:
